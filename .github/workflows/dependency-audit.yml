name: Dependency Security Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run npm audit
        shell: bash
        run: |
          set +e
          npm audit --json > audit-report.json
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("audit-report.json", "utf8"));
            console.log("Vulnerability totals:", JSON.stringify(r.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === "string" ? v : {name:v.name, title:v.title, range:v.range, url:v.url})
              }));
            }
          '
          exit 0
      - name: Upload audit report
        uses: actions/upload-artifact@v5
        with:
          name: npm-audit-report
          path: audit-report.json
